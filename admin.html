<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آثار الرقمية | لوحة التحكم السحابية المتقدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Chakra Petch', 'Cairo', sans-serif; background-color: #0c0c0e; color: #e4e4e7; margin: 0; padding: 2rem; letter-spacing: 0.5px; }
        .admin-wrap { max-width: 1200px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .admin-header h2 { color: #d4af37; margin: 0; font-weight: 700; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; }
        .logout-btn:hover { background: #b91c1c; }
        
        .admin-grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-bottom: 2rem; }
        @media (max-width: 900px) { .admin-grid-layout { grid-template-columns: 1fr; } }

        .admin-block { background: #18181b; border: 1px solid #27272a; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .admin-block h3 { color: #d4af37; margin-top: 0; font-size: 1.15rem; border-bottom: 1px solid #27272a; padding-bottom: 0.5rem; }
        
        .admin-input-group { margin-bottom: 1rem; }
        .admin-input-group label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0.4rem; }
        .admin-field { width: 100%; background: #09090b; border: 1px solid #27272a; color: #fff; padding: 0.7rem; border-radius: 6px; font-family: inherit; box-sizing: border-box; }
        .admin-field:focus { border-color: #d4af37; outline: none; }
        .admin-btn { background: #d4af37; color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: inherit; transition: 0.3s; width: 100%; }
        .admin-btn:hover { background: #b5922e; }

        .order-card { background: #18181b; border: 1px solid #27272a; padding: 1.5rem; border-radius: 14px; margin-bottom: 1.5rem; border-right: 4px solid #d4af37; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; background: #09090b; padding: 1rem; border-radius: 8px; }
        .grid-item { font-size: 0.95rem; color: #a1a1aa; }
        .grid-item strong { color: #f4f4f5; display: block; margin-bottom: 0.2rem; }
        
        .login-panel { max-width: 400px; margin: 15vh auto; background: #18181b; padding: 2.5rem; border-radius: 16px; border: 1px solid #27272a; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .no-orders { text-align: center; color: #71717a; padding: 3rem; font-size: 1.1rem; }
        .tag-idea { background: #27272a; color: #d4af37; padding: 0.5rem 1rem; border-radius: 6px; margin-top: 0.5rem; display: inline-block; font-size: 0.9rem; border: 1px dashed #d4af37; }
        .data-list-item { background: #09090b; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border: 1px solid #27272a; }
        .delete-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.1rem; }
        .delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div id="loginArea" class="login-panel">
        <h3 style="color: #d4af37; margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-halved"></i> نظام الإدارة السحابي الآمن</h3>
        <p style="color: #71717a; font-size: 0.85rem; margin-bottom: 1.5rem;">يرجى إدخال كلمة المرور المشفرة لآثار الرقمية</p>
        <input type="password" id="passCode" class="login-field admin-field" style="text-align:center; margin-bottom: 1.5rem;" placeholder="كلمة المرور">
        <button onclick="submitLogin()" class="login-btn admin-btn">تحقق وتأكيد الجلسة</button>
    </div>

    <div id="dashboardArea" class="admin-wrap" style="display: none;">
        <div class="admin-header">
            <h2><i class="fa-solid fa-server"></i> آثار الرقمية | السجلات السحابية الموحدة</h2>
            <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج آمن</button>
        </div>

        <div class="admin-grid-layout">
            <div>
                <div class="admin-block">
                    <h3><i class="fa-solid fa-plus"></i> إضافة عمل جديد إلى "أعمالنا السابقة" (MongoDB)</h3>
                    <form id="adminProjectForm" onsubmit="handleAdminSubmit(event)">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="admin-input-group">
                                <label>اسم المشروع (بالعربية)</label>
                                <input type="text" id="adminProjTitleAr" class="admin-field" required placeholder="مثال: بوت الأتمتة الذكي">
                            </div>
                            <div class="admin-input-group">
                                <label>اسم المشروع (بالإنجليزية)</label>
                                <input type="text" id="adminProjTitleEn" class="admin-field" required placeholder="Example: Smart Automation Bot">
                            </div>
                        </div>
                        <div class="admin-input-group">
                            <label>رابط المعاينة أو الموقع</label>
                            <input type="url" id="adminProjLink" class="admin-field" required placeholder="https://example.com">
                        </div>
                        <button type="submit" class="admin-btn" style="background:#34d399; color:#000;">حفظ ونشر المشروع على الموقع فوراً</button>
                    </form>
                </div>

                <h3 style="color: #f4f4f5; margin-bottom: 1.5rem;"><i class="fa-solid fa-list-check" style="color: #d4af37;"></i> الطلبات السحابية التاريخية الواردة</h3>
                <div id="ordersContainer"></div>
            </div>

            <div>
                <div class="admin-block">
                    <h3><i class="fa-solid fa-folder-open"></i> نماذج الأعمال المعروضة حالياً</h3>
                    <div id="adminProjectsContainer" style="max-height: 400px; overflow-y: auto;">
                        <p style="color:#71717a;">جاري التحميل...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "athaar_secure_token";

        document.addEventListener("DOMContentLoaded", () => {
            evaluateSession();
        });

        function evaluateSession() {
            const token = localStorage.getItem(STORAGE_KEY);
            if (!token) {
                document.getElementById("loginArea").style.display = "block";
                document.getElementById("dashboardArea").style.display = "none";
            } else {
                document.getElementById("loginArea").style.display = "none";
                document.getElementById("dashboardArea").style.display = "block";
                fetchCloudOrders();
                fetchAdminProjects();
            }
        }

        async function submitLogin() {
            const password = document.getElementById("passCode").value;
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem(STORAGE_KEY, data.token);
                evaluateSession();
            } else {
                alert(data.message || "كلمة السر خاطئة.");
            }
        }

        function triggerLogout() {
            localStorage.removeItem(STORAGE_KEY);
            evaluateSession();
        }

        async function fetchCloudOrders() {
            const token = localStorage.getItem(STORAGE_KEY);
            const response = await fetch('/api/admin/orders', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            if (!data.success) {
                triggerLogout();
                return;
            }

            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";

            if (!data.orders || data.orders.length === 0) {
                container.innerHTML = `<div class="no-orders"><i class="fa-regular fa-folder-open" style="font-size:3rem; display:block; margin-bottom:1rem;"></i> لا يوجد أي طلبات في الداتابيز حالياً.</div>`;
                return;
            }

            data.orders.forEach(order => {
                container.innerHTML += `
                    <div class="order-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong style="color:#d4af37; font-size:1.1rem;"><i class="fa-solid fa-user"></i> ${order.name || 'غير محدد'}</strong>
                            <span style="color:#71717a; font-size:0.85rem;"><i class="fa-solid fa-clock"></i> ${order.requestTime || 'غير مسجل'}</span>
                        </div>
                        <div class="order-grid">
                            <div class="grid-item"><strong>البريد الإلكتروني</strong>${order.email || 'غَيْرُ مُحَدَّدٍ'}</div>
                            <div class="grid-item"><strong>رقم الهاتف</strong>${order.phone || 'غَيْرُ مُحَدَّدٍ'}</div>
                            <div class="grid-item"><strong>الخدمة المطلوبة</strong>${order.service || 'غَيْرُ مُحَدَّدٍ'}</div>
                            <div class="grid-item"><strong>طريقة الدفع</strong>${order.paymentMode || 'غَيْرُ مُحَدَّدٍ'}</div>
                            <div class="grid-item"><strong>رقم المرجع (Ref)</strong>${order.ref || 'لا يوجد'}</div>
                            <div class="grid-item"><strong>المبلغ المستحق</strong>${order.finalDue || 'غَيْرُ مُحَدَّدٍ'}</div>
                        </div>
                        ${order.idea ? `<div class="tag-idea"><strong><i class="fa-regular fa-lightbulb"></i> الفكرة المقترحة:</strong> ${order.idea}</div>` : ''}
                    </div>
                `;
            });
        }

        // جلب المشاريع من المونجو وعرضها في قائمة الإدارة الحالية
        async function fetchAdminProjects() {
            const response = await fetch('/api/projects');
            const data = await response.json();
            const container = document.getElementById("adminProjectsContainer");
            if (!container) return;
            
            container.innerHTML = "";
            if (data.projects && data.projects.length > 0) {
                data.projects.forEach(proj => {
                    container.innerHTML += `
                        <div class="data-list-item">
                            <span><strong>${proj.titleAr}</strong> - <a href="${proj.link}" target="_blank" style="color:#d4af37; text-decoration:none;">معاينة</a></span>
                            <button class="delete-btn" onclick="deleteProject('${proj._id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>`;
                });
            } else {
                container.innerHTML = '<p style="color:#71717a; text-align:center; padding:1rem;">لم تقم بإضافة نماذج أعمال سحابية بعد.</p>';
            }
        }

        // معالجة وإرسال العمل الجديد لقاعدة البيانات
        async function handleAdminSubmit(e) {
            e.preventDefault();
            const titleAr = document.getElementById("adminProjTitleAr").value;
            const titleEn = document.getElementById("adminProjTitleEn").value;
            const link = document.getElementById("adminProjLink").value;
            
            const token = localStorage.getItem(STORAGE_KEY);
            const response = await fetch('/api/admin/projects', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ titleAr, titleEn, link })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById("adminProjectForm").reset();
                fetchAdminProjects();
            } else {
                alert(data.message);
            }
        }

        // حذف عمل من قاعدة البيانات السحابية بالكامل
        async function deleteProject(id) {
            if(!confirm("هل أنت متأكد من حذف هذا النموذج نهائياً من قاعدة البيانات السحابية؟")) return;
            const token = localStorage.getItem(STORAGE_KEY);
            const response = await fetch(`/api/admin/projects/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if(data.success) {
                fetchAdminProjects();
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
