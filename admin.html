<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة آثار الرقمية | Athaar Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #060a12;
            --bg-secondary: #0b1220;
            --bg-card: rgba(11, 18, 32, 0.9);
            --accent: #d4af37;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border: rgba(212, 175, 55, 0.15);
            --success: #2ea44f;
            --danger: #cf222e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 2rem; }
        
        .login-container { max-width: 400px; margin: 10% auto; background: var(--bg-secondary); border: 1px solid var(--accent); padding: 2.5rem; border-radius: 16px; text-align: center; box-shadow: 0 0 20px rgba(212,175,55,0.1); }
        .login-container h2 { font-family: 'Chakra Petch', sans-serif; color: var(--accent); margin-bottom: 1.5rem; }
        .form-field { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-bottom: 1.2rem; outline: none; text-align: center; }
        .form-field:focus { border-color: var(--accent); }
        .btn-action { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: var(--accent); color: #060a12; }

        .dashboard-layout { display: none; max-width: 1300px; margin: 0 auto; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .dash-header h1 { font-family: 'Chakra Petch', sans-serif; color: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; text-align: center; position: relative; }
        .stat-card h3 { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--accent); font-family: 'Chakra Petch', sans-serif; }
        
        .controls-zone { background: var(--bg-secondary); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; }
        
        .orders-table-container { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px 20px; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.4); color: var(--accent); font-size: 0.9rem; }
        tr:hover { background: rgba(212,175,55,0.02); }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .badge-seat { background: rgba(212,175,55,0.12); color: var(--accent); border: 1px solid var(--accent); }
        .badge-full { background: rgba(46,164,79,0.15); color: #46c46e; border: 1px solid var(--success); }
        
        .btn-view { padding: 5px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--text-muted); color: var(--text-main); border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
        .btn-view:hover { border-color: var(--accent); color: var(--accent); }
        
        /* Modal for images */
        .img-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; padding: 2rem; }
        .img-modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div class="login-container" id="loginBlock">
        <h2>لوحة إشراف آثار</h2>
        <input type="password" id="adminPassField" class="form-field" placeholder="أدخل مفتاح العبور الآمن">
        <button class="btn-action" onclick="tryLogin()">ولوج النظام</button>
    </div>

    <div class="dashboard-layout" id="dashboardBlock">
        <div class="dash-header">
            <h1><i class="fa-solid fa-gauge-high"></i> ATHAAR DASHBOARD</h1>
            <button class="btn-action" style="width: auto; padding: 8px 20px;" onclick="logout()">خروج</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي طلبات المنصة</h3>
                <div class="value" id="countTotal">0</div>
            </div>
            <div class="stat-card">
                <h3>تطوير البوتات</h3>
                <div class="value" id="countBots">0</div>
            </div>
            <div class="stat-card">
                <h3>بناء المواقع</h3>
                <div class="value" id="countWeb">0</div>
            </div>
            <div class="stat-card">
                <h3>المقاطع المرئية</h3>
                <div class="value" id="countVideo">0</div>
            </div>
        </div>

        <div class="controls-zone">
            <div>
                <h3 style="margin-bottom: 4px;">حالة استقبال المشاريع</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">التحكم التلقائي الفوري في تفعيل نموذج حجز مقعد للعملاء.</p>
            </div>
            <button class="btn-action" id="lockSystemBtn" style="width: auto; padding: 10px 25px;" onclick="toggleSystemLock()"></button>
        </div>

        <div class="orders-table-container">
            <table>
                <thead>
                    <tr>
                        <th>العميل</th>
                        <th>التواصل</th>
                        <th>الخدمة المستهدفة</th>
                        <th>نوع الحجز</th>
                        <th>القيمة المحتسبة</th>
                        <th>تفاصيل الفكرة والإضافات</th>
                        <th>الإيصال</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="img-modal" id="imgModal" onclick="this.style.display='none'">
        <img id="modalTargetImg" src="" alt="Receipt">
    </div>

    <script>
        let token = "";

        function tryLogin() {
            const pass = document.getElementById("adminPassField").value;
            fetch('/api/admin/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    token = pass;
                    document.getElementById("loginBlock").style.display = "none";
                    document.getElementById("dashboardBlock").style.display = "block";
                    renderDashboard(data);
                } else {
                    alert("خطأ في كلمة السر العلوية!");
                }
            })
            .catch(() => alert("فشل الاتصال بالخادم."));
        }

        function renderDashboard(data) {
            // تحديث الإحصائيات الحقيقية من السيرفر وليس الـ LocalStorage
            document.getElementById("countTotal").innerText = data.orders.length;
            
            const bots = data.orders.filter(o => o.service.includes("بوتات")).length;
            const web = data.orders.filter(o => o.service.includes("المواقع")).length;
            const vid = data.orders.filter(o => o.service.includes("المرئية")).length;
            
            document.getElementById("countBots").innerText = bots;
            document.getElementById("countWeb").innerText = web;
            document.getElementById("countVideo").innerText = vid;

            // تحديث زر القفل والإغلاق الخاص بالنظام
            const lockBtn = document.getElementById("lockSystemBtn");
            if(data.systemLocked) {
                lockBtn.innerText = "فتح استقبال الطلبات الآن";
                lockBtn.style.borderColor = "var(--success)";
                lockBtn.style.color = "var(--success)";
            } else {
                lockBtn.innerText = "إغلاق حجز المقاعد (صيانة/اكتفاء)";
                lockBtn.style.borderColor = "var(--danger)";
                lockBtn.style.color = "var(--danger)";
            }

            // تعبئة الجدول بالبيانات المكتملة
            const tbody = document.getElementById("ordersTableBody");
            tbody.innerHTML = "";

            if(data.orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-muted);">لا توجد طلبات مسجلة في قاعدة البيانات حالياً.</td></tr>`;
                return;
            }

            data.orders.reverse().forEach(order => {
                const tr = document.createElement("tr");
                
                const receiptCell = order.receiptFile 
                    ? `<button class="btn-view" onclick="viewReceipt('${order.receiptFile.base64}')"><i class="fa-solid fa-image"></i> عرض</button>` 
                    : `<span style="color:var(--text-muted)">لا يوجد</span>`;

                tr.innerHTML = `
                    <td><strong>${order.name}</strong><br><span style="font-size:0.8rem; color:var(--text-muted);">${order.email}</span></td>
                    <td><a href="tel:${order.phone}" style="color:var(--accent); text-decoration:none;" dir="ltr">${order.phone}</a></td>
                    <td><span style="font-weight:600">${order.service}</span></td>
                    <td><span class="badge ${order.paymentMode === 'seat' ? 'badge-seat' : 'badge-full'}">${order.paymentMode === 'seat' ? 'حجز مقعد' : 'تأكيد دفع'}</span><br><small style="color:var(--text-muted)">الرقم: ${order.ref}</small></td>
                    <td style="font-family:'Chakra Petch', sans-serif; font-weight:700; color:var(--accent);">${order.finalDue}</td>
                    <td style="max-width:300px; font-size:0.9rem; white-space: pre-line;">${order.idea}</td>
                    <td>${receiptCell}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${order.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSystemLock() {
            fetch('/api/admin/toggle-lock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: token })
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.success) {
                    refreshData();
                }
            });
        }

        function refreshData() {
            fetch('/api/admin/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: token })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) renderDashboard(data);
            });
        }

        function viewReceipt(base64) {
            const modal = document.getElementById("imgModal");
            const img = document.getElementById("modalTargetImg");
            img.src = base64;
            modal.style.display = "flex";
        }

        function logout() {
            window.location.reload();
        }
    </script>
</body>
</html>
