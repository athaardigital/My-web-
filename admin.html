<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية | آثار الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Chakra Petch', 'Cairo', sans-serif; background-color: #0c0c0e; color: #e4e4e7; margin: 0; padding: 1rem; box-sizing: border-box; }
        .admin-wrap { max-width: 1200px; margin: 0 auto; padding: 10px; }
        .admin-header { display: flex; flex-direction: column; gap: 1rem; border-bottom: 1px solid #27272a; padding-bottom: 1.5rem; margin-bottom: 2rem; }
        @media (min-width: 768px) { .admin-header { flex-direction: row; justify-content: space-between; align-items: center; } }
        .admin-header h2 { color: #d4af37; margin: 0; font-size: 1.4rem; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        
        .admin-grid-layout { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 992px) { .admin-grid-layout { grid-template-columns: 2fr 1fr; } }

        .admin-block { background: #18181b; border: 1px solid #27272a; padding: 1.2rem; border-radius: 12px; }
        .admin-input-group { margin-bottom: 1rem; }
        .admin-field { width: 100%; background: #09090b; border: 1px solid #27272a; color: #fff; padding: 0.7rem; border-radius: 6px; font-family: inherit; box-sizing: border-box; }
        .admin-btn { background: #d4af37; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: inherit; width: 100%; transition: 0.2s; }
        .admin-btn:hover { background: #b5922e; }

        .order-card { background: #18181b; border: 1px solid #27272a; padding: 1.2rem; border-radius: 14px; margin-bottom: 1.5rem; border-right: 4px solid #d4af37; }
        .order-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; margin-top: 1rem; background: #09090b; padding: 1rem; border-radius: 8px; }
        @media (min-width: 480px) { .order-grid { grid-template-columns: 1fr 1fr; } }
        .grid-item { font-size: 0.9rem; color: #a1a1aa; word-break: break-all; }
        .grid-item strong { color: #f4f4f5; display: block; margin-bottom: 0.2rem; }
        
        .login-panel { max-width: 400px; margin: 10vh auto; background: #18181b; padding: 2rem; border-radius: 16px; border: 1px solid #27272a; text-align: center; box-sizing: border-box; }
        .data-list-item { background: #09090b; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border: 1px solid #27272a; gap: 10px; }
        .delete-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="loginArea" class="login-panel">
        <h3 style="color: #d4af37; margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-halved"></i> نظام الإدارة الآمن</h3>
        <p style="color: #71717a; font-size: 0.85rem; margin-bottom: 1.5rem;">يرجى إدخال كلمة المرور السحابية للدخول</p>
        <input type="password" id="passCode" class="admin-field" style="text-align:center; margin-bottom: 1.5rem;" placeholder="كلمة المرور">
        <button onclick="submitLogin()" class="admin-btn">تأكيد الجلسة</button>
    </div>

    <div id="dashboardArea" class="admin-wrap" style="display: none;">
        <div class="admin-header">
            <h2><i class="fa-solid fa-server"></i> السجلات والتحكم السحابي الموحد</h2>
            <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>

        <div class="admin-grid-layout">
            <div>
                <div class="admin-block" style="margin-bottom: 1.5rem;">
                    <h3 style="color:#d4af37; margin-top:0;">إضافة عمل جديد إلى الموقع (MongoDB)</h3>
                    <form id="adminProjectForm" onsubmit="handleAdminSubmit(event)">
                        <div style="display:grid; grid-template-columns: 1fr; gap: 1rem;">
                            <div class="admin-input-group">
                                <label style="font-size:0.85rem; color:#a1a1aa;">اسم المشروع (بالعربية)</label>
                                <input type="text" id="adminProjTitleAr" class="admin-field" required>
                            </div>
                            <div class="admin-input-group">
                                <label style="font-size:0.85rem; color:#a1a1aa;">اسم المشروع (بالإنجليزية)</label>
                                <input type="text" id="adminProjTitleEn" class="admin-field" required>
                            </div>
                        </div>
                        <div class="admin-input-group">
                            <label style="font-size:0.85rem; color:#a1a1aa;">رابط الموقع أو المعاينة</label>
                            <input type="url" id="adminProjLink" class="admin-field" required>
                        </div>
                        <button type="submit" class="admin-btn" style="background:#34d399;">نشر العمل في قاعدة البيانات</button>
                    </form>
                </div>

                <h3 style="color: #f4f4f5;"><i class="fa-solid fa-list-check" style="color: #d4af37;"></i> الطلبات التاريخية المستلمة</h3>
                <div id="ordersContainer"></div>
            </div>

            <div>
                <div class="admin-block">
                    <h3 style="color:#d4af37; margin-top:0;">النماذج المعروضة حالياً</h3>
                    <div id="adminProjectsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "athaar_secure_token";

        document.addEventListener("DOMContentLoaded", evaluateSession);

        function evaluateSession() {
            const token = localStorage.getItem(STORAGE_KEY);
            if (!token) {
                document.getElementById("loginArea").style.display = "block";
                document.getElementById("dashboardArea").style.display = "none";
            } else {
                document.getElementById("loginArea").style.display = "none";
                document.getElementById("dashboardArea").style.display = "block";
                fetchCloudOrders();
                fetchAdminProjects();
            }
        }

        async function submitLogin() {
            const password = document.getElementById("passCode").value;
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem(STORAGE_KEY, data.token);
                evaluateSession();
            } else {
                alert(data.message);
            }
        }

        function triggerLogout() {
            localStorage.removeItem(STORAGE_KEY);
            evaluateSession();
        }

        async function fetchCloudOrders() {
            const token = localStorage.getItem(STORAGE_KEY);
            const response = await fetch('/api/admin/orders', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (!data.success) return triggerLogout();

            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";
            if (data.orders.length === 0) {
                container.innerHTML = '<p style="color:#71717a; text-align:center; padding:2rem;">لا توجد طلبات بعد.</p>';
                return;
            }

            data.orders.forEach(order => {
                container.innerHTML += `
                    <div class="order-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:5px;">
                            <strong style="color:#d4af37;">${order.name || 'غير محدد'}</strong>
                            <span style="color:#71717a; font-size:0.8rem;">${order.requestTime || ''}</span>
                        </div>
                        <div class="order-grid">
                            <div class="grid-item"><strong>البريد</strong>${order.email || '-'}</div>
                            <div class="grid-item"><strong>الهاتف</strong>${order.phone || '-'}</div>
                            <div class="grid-item"><strong>الخدمة</strong>${order.service || '-'}</div>
                            <div class="grid-item"><strong>الدفع</strong>${order.paymentMode || '-'}</div>
                            <div class="grid-item"><strong>المجموع</strong>${order.finalDue || '-'}</div>
                        </div>
                        ${order.idea ? `<div style="background:#27272a; padding:8px; border-radius:6px; margin-top:10px; font-size:0.9rem; color:#d4af37;"><strong>الوصف:</strong> ${order.idea}</div>` : ''}
                    </div>`;
            });
        }

        async function fetchAdminProjects() {
            const response = await fetch('/api/projects');
            const data = await response.json();
            const container = document.getElementById("adminProjectsContainer");
            container.innerHTML = "";
            if (data.projects && data.projects.length > 0) {
                data.projects.forEach(proj => {
                    container.innerHTML += `
                        <div class="data-list-item">
                            <span style="word-break:break-all;"><strong>${proj.titleAr}</strong></span>
                            <button class="delete-btn" onclick="deleteProject('${proj._id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>`;
                });
            } else {
                container.innerHTML = '<p style="color:#71717a; text-align:center;">لا توجد نماذج.</p>';
            }
        }

        async function handleAdminSubmit(e) {
            e.preventDefault();
            const titleAr = document.getElementById("adminProjTitleAr").value;
            const titleEn = document.getElementById("adminProjTitleEn").value;
            const link = document.getElementById("adminProjLink").value;
            const token = localStorage.getItem(STORAGE_KEY);
            
            const response = await fetch('/api/admin/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ titleAr, titleEn, link })
            });
            const data = await response.json();
            if(data.success) {
                document.getElementById("adminProjectForm").reset();
                fetchAdminProjects();
            } else {
                alert(data.message);
            }
        }

        async function deleteProject(id) {
            if(!confirm("هل أنت متأكد؟")) return;
            const token = localStorage.getItem(STORAGE_KEY);
            const response = await fetch(`/api/admin/projects/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if(data.success) fetchAdminProjects();
        }
    </script>
</body>
</html>
