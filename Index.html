<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آثار الرقمية | Athaar Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #060a12;
            --bg-secondary: #0b1220;
            --accent: #d4af37;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border: rgba(212, 175, 55, 0.15);
            --success: #2ea44f;
            --danger: #cf222e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-header h1 {
            font-family: 'Chakra Petch', sans-serif;
            color: var(--accent);
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .system-status-badge {
            display: none;
            text-align: center;
            padding: 12px;
            background: rgba(207, 34, 46, 0.1);
            border: 1px solid var(--danger);
            color: #ff6b73;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        select.form-control {
            cursor: pointer;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .radio-option {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(0, 0, 0, 0.2);
        }

        .radio-option input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .radio-option:hover {
            border-color: var(--accent);
        }

        .conditional-zone {
            display: none;
            border-right: 2px solid var(--accent);
            padding-right: 15px;
            margin-top: 1.5rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-submit:disabled {
            border-color: var(--text-muted);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .message-banner {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .message-banner.success {
            background: rgba(46, 164, 79, 0.15);
            border: 1px solid var(--success);
            color: #46c46e;
        }

        .message-banner.error {
            background: rgba(207, 34, 46, 0.15);
            border: 1px solid var(--danger);
            color: #ff6b73;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1>ATHAAR DIGITAL</h1>
            <p>صِيَاغَةُ الْهُوِيَّاتِ الرَّقْمِيَّةِ وَالْحُلُولِ التَّقْنِيَّةِ</p>
        </div>

        <div id="systemLockedBadge" class="system-status-badge">
            <i class="fa-solid fa-triangle-exclamation"></i> عُذْرًا، نَمُوذَجُ اسْتِقْبَالِ الْمَشَارِيعِ مُغْلَقٌ حَالِيًّا لِلصِّيَانَةِ أَوْ لِلاكْتِفَاءِ.
        </div>

        <form id="orderForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> الِاسْمُ الْكَامِلُ</label>
                <input type="text" id="name" class="form-control" required placeholder="أدخل اسمك الكريم">
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> الْبَرِيدُ الإِلِكْتْرُونِيُّ</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="phone"><i class="fa-solid fa-phone"></i> رَقْمُ الْهَاتِفِ (وَاتْسَاب / تِلِجْرَام)</label>
                <input type="tel" id="phone" class="form-control" required placeholder="+213">
            </div>

            <div class="form-group">
                <label for="service"><i class="fa-solid fa-cubes"></i> الْخِدْمَةُ الْمُسْتَهْدَفَةُ</label>
                <select id="service" class="form-control" required>
                    <option value="" disabled selected>اختر الخدمة المطلوبة...</option>
                    <option value="تطوير بوتات تليجرام الذكية (Python)">تطوير بوتات تليجرام الذكية (Python)</option>
                    <option value="بناء المواقع والواجهات الرقمية">بناء المواقع والواجهات الرقمية</option>
                    <option value="صناعة المحتوى والمقاطع المرئية السينمائية">صناعة المحتوى والمقاطع المرئية السينمائية</option>
                </select>
            </div>

            <div class="form-group">
                <label for="idea"><i class="fa-solid fa-lightbulb"></i> تَفَاصِيلُ الْفِكْرَةِ وَالإِضَافَاتِ</label>
                <textarea id="idea" class="form-control" placeholder="اشرح لنا أبعاد مشروعك باختصار..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-credit-card"></i> نَوْعُ الْحَجْزِ وَآلِيَّةُ الدَّفْعِ</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="paymentMode" value="seat" checked onclick="togglePaymentZone(false)">
                        <span>حجز مقعد مبدئي</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="paymentMode" value="full" onclick="togglePaymentZone(true)">
                        <span>تأكيد الدفع المالي</span>
                    </label>
                </div>
            </div>

            <div id="paymentConditionalZone" class="conditional-zone">
                <div class="form-group">
                    <label for="ref">رَقْمُ الْحَوَالَةِ أَوْ الْمَرْجِعِ الْبَرِيدِيِّ (Ref)</label>
                    <input type="text" id="ref" class="form-control" placeholder="أدخل رقم المعاملة">
                </div>
                <div class="form-group">
                    <label for="finalDue">الْقِيمَةُ الْمَالِيَّةُ الْمَحْسُوبَةُ</label>
                    <input type="text" id="finalDue" class="form-control" placeholder="مثال: 5000 دج">
                </div>
                <div class="form-group">
                    <label for="receiptFile">رَفْعُ نُسْخَةٍ مِنْ إِيقَاعِ الإِيصَالِ (صورة)</label>
                    <input type="file" id="receiptFile" class="form-control" accept="image/*" onchange="processReceiptFile()">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> إِرْسَالُ الطَّلَبِ إِلَى النِّظَامِ
            </button>

            <div id="messageBanner" class="message-banner"></div>
        </form>
    </div>

    <script>
        let globalReceiptBase64 = "";
        let globalReceiptName = "";

        // الفحص الفوري لحالة قفل أو فتح الاستقبال من السيرفر عند تحميل الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/api/system-state')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.systemLocked) {
                        document.getElementById("systemLockedBadge").style.display = "block";
                        document.getElementById("submitBtn").disabled = true;
                        // قفل كافة الحقول لمنع التلاعب
                        document.querySelectorAll("#orderForm input, #orderForm select, #orderForm textarea").forEach(el => el.disabled = true);
                    }
                })
                .catch(() => console.error("فشل فحص حالة النظام من السيرفر."));
        });

        function togglePaymentZone(show) {
            const zone = document.getElementById("paymentConditionalZone");
            zone.style.display = show ? "block" : "none";
            
            const refInput = document.getElementById("ref");
            if (!show) {
                refInput.value = "";
                document.getElementById("finalDue").value = "";
                document.getElementById("receiptFile").value = "";
                globalReceiptBase64 = "";
                globalReceiptName = "";
            }
        }

        // تحويل ملف الإيصال إلى ترميز Base64 ليتوافق مع استقبال السيرفر المطور
        function processReceiptFile() {
            const fileInput = document.getElementById("receiptFile");
            const file = fileInput.files[0];
            if (!file) return;

            globalReceiptName = file.name;
            const reader = new FileReader();
            reader.onloadend = function () {
                globalReceiptBase64 = reader.result;
            };
            reader.readAsDataURL(file);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const banner = document.getElementById("messageBanner");
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جَارٍ مَعَالَجَةُ الرَّفْعِ...`;

            const paymentMode = document.querySelector('input[name="paymentMode"]:checked').value;

            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                service: document.getElementById("service").value,
                idea: document.getElementById("idea").value,
                paymentMode: paymentMode,
                ref: document.getElementById("ref").value || undefined,
                finalDue: document.getElementById("finalDue").value || "مبدئي",
                receiptFileBase64: globalReceiptBase64 || null,
                receiptFileName: globalReceiptName || null
            };

            fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                banner.style.display = "block";
                if (data.success) {
                    banner.className = "message-banner success";
                    banner.innerText = data.message;
                    document.getElementById("orderForm").reset();
                    togglePaymentZone(false);
                } else {
                    banner.className = "message-banner error";
                    banner.innerText = data.message;
                }
            })
            .catch(() => {
                banner.style.display = "block";
                banner.className = "message-banner error";
                banner.innerText = "حَدَثَ خَطَأٌ فِي الِاتِّصَالِ بِالسِّيرْفَرِ، أَعِدْ الْمُحَاوَلَةَ.";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> إِرْسَالُ الطَّلَبِ إِلَى النِّظَامِ`;
            });
        }
    </script>
</body>
</html>
